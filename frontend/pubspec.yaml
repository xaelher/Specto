name: specto
description: "Neo-Fintech grade tracker for students and observers."
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Network
  dio: ^5.7.0

  # Local storage
  shared_preferences: ^2.3.2

  # UI
  google_fonts: ^6.2.1

  # Localization / date formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
