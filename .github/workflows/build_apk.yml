name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure and Build APK
        working-directory: ./frontend
        run: |
          flutter config --enable-android
          flutter create --platforms=android .
          
          # Гарантируем наличие разрешений в AndroidManifest.xml
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
              sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"\/>' "$MANIFEST"
            fi
            if ! grep -q "usesCleartextTraffic" "$MANIFEST"; then
              sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$MANIFEST"
            fi
          fi

          flutter pub get
          flutter build apk --release

      - name: Prepare APK File
        run: |
          mkdir -p release-output
          cp frontend/build/app/outputs/flutter-apk/app-release.apk release-output/Specto.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Specto-APK
          path: release-output/Specto.apk
          retention-days: 30

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.0.0
          name: "Specto v1.0.0"
          body: |
            ## 📱 Specto Android Release
            
            Скачайте готовый файл **`Specto.apk`** ниже и установите на телефон.
            
            - 🛠 **Сборка:** Автоматическая сборка GitHub Actions
            - 📖 **Инструкция по запуску:** [ANDROID_GUIDE.md](https://github.com/${{ github.repository }}/blob/main/ANDROID_GUIDE.md)
          draft: false
          prerelease: false
          files: release-output/Specto.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

